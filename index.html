<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Dover Apartments</title>
    <style>
        :root {
            --blue: #1709e0;
            --dark: #10213f;
            --bg: #f5f7fb;
            --green: #0dA451;
            --muted: #677085;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: var(--bg);
            color: var(--dark);
            padding-bottom: 30px;
        }
        header {
            background: linear-gradient(135deg, #1709e0, #2279ed);
            color: #fff;
            padding: 22px 16px;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 12px rgba(23, 9, 224, 0.15);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 22px;
        }
        .sub {
            opacity: 0.85;
            font-size: 13px;
            margin-top: 2px;
        }
        .hero {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.3;
            margin: 14px 0 10px;
        }
        .search-box {
            background: #fff;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--dark);
        }
        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 8px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        nav button {
            background: none;
            border: none;
            color: var(--muted);
            font-weight: 600;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        nav button.active {
            color: var(--blue);
            border-bottom: 2px solid var(--blue);
        }
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 0;
        }
        .chip {
            background: #fff;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            color: var(--dark);
            cursor: pointer;
        }
        .chip.active {
            background: var(--blue);
            color: #fff;
            border-color: var(--blue);
        }
        .grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 12px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(16, 33, 63, 0.05);
            border: 1px solid var(--border);
            position: relative;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            background: #eef2ff;
            color: var(--blue);
            margin-bottom: 8px;
        }
        .badge.warning {
            background: #fef3c7;
            color: #d97706;
        }
        .card .price {
            font-size: 20px;
            font-weight: 800;
            color: var(--green);
        }
        .card .title {
            font-size: 16px;
            font-weight: 700;
            margin: 4px 0;
        }
        .card .addr {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .card .btn-link {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: var(--blue);
            color: #fff;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 8px;
        }
        .livestatus {
            font-size: 12px;
            color: var(--muted);
            margin: 8px 0;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">🏢 <span>Dover Apartments</span></div>
        <div class="sub">DOVER, NJ 07801</div>
        <div class="hero">Encuentra tu próximo hogar en Dover</div>
        <div class="search-box">
            <input type="text" id="q" placeholder="Ej: 2 habitaciones, Country Village..." onkeyup="filterResults()">
        </div>
    </header>

    <main>
        <nav>
            <button class="active">🏠 Inicio</button>
            <button onclick="alert('Búsqueda guardada')">⭐ Favoritos</button>
            <button onclick="alert('Alertas activas')">🔔 Alertas</button>
        </nav>

        <div class="chips">
            <button class="chip active" onclick="setBedFilter('all', this)">Todos</button>
            <button class="chip" onclick="setBedFilter('2', this)">2 Habitaciones</button>
            <button class="chip" onclick="setBedFilter('3', this)">3 Habitaciones</button>
        </div>

        <div class="livestatus" id="lastupdate">Cargando actualización...</div>

        <div class="grid" id="grid">
            <p style="text-align: center; color: var(--muted);">Cargando apartamentos...</p>
        </div>
    </main>

    <script>
        let allData = [];
        let currentBedFilter = 'all';

        async function init() {
            try {
                const res = await fetch('data/apartments.json?t=' + Date.now());
                allData = await res.json();

                const timeRes = await fetch('data/last_update.txt?t=' + Date.now());
                const timeText = await timeRes.text();
                if (timeText) {
                    const dt = new Date(timeText);
                    document.getElementById('lastupdate').innerText = '🔄 Actualizado: ' + dt.toLocaleString();
                }

                render();
            } catch (e) {
                console.error(e);
                document.getElementById('grid').innerHTML = '<p style="text-align: center;">Error al cargar los apartamentos.</p>';
            }
        }

        function setBedFilter(beds, btn) {
            currentBedFilter = beds;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        function filterResults() {
            render();
        }

        function render() {
            const q = document.getElementById('q').value.toLowerCase();
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            const filtered = allData.filter(item => {
                const matchQ = !q || (item.name && item.name.toLowerCase().includes(q)) || (item.addr && item.addr.toLowerCase().includes(q));
                const matchBed = currentBedFilter === 'all' || String(item.beds) === currentBedFilter;
                return matchQ && matchBed;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="text-align: center; color: var(--muted); padding: 20px;">No se encontraron apartamentos con estos filtros.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';

                const status = item.status || '🟢 DISPONIBLE AHORA';
                const statusClass = status.includes('por confirmar') ? 'badge warning' : 'badge';

                card.innerHTML = `
                    <span class="${statusClass}">${status}</span>
                    <div class="price">$${Number(item.price).toLocaleString()}/mes</div>
                    <div class="title">${item.name || 'Apartamento en Dover'}</div>
                    <div class="addr">📍 ${item.addr}</div>
                    <div style="font-size: 13px; color: var(--muted); margin-bottom: 8px;">🛏️ ${item.beds} Dormitorios | Fuente: ${item.sourceName || 'Web'}</div>
                    <a href="${item.source}" target="_blank" class="btn-link">Ver anuncio original ↗</a>
                `;
                grid.appendChild(card);
            });
        }

        init();
    </script>
</body>
</html>
